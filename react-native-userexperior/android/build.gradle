apply plugin: 'com.android.library'

buildscript {
    repositories {
        jcenter()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

repositories {
	mavenCentral()
	jcenter()
	maven {
		url "$rootDir/../node_modules/react-native/android"
	}
}

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
	implementation 'com.userexperior:userexperior-android:7.5.3'
	implementation 'com.facebook.react:react-native:+'
}
